name: IINA regressions

on:
  push:
    branches: [iina-dv-atmos]
  pull_request:
    branches: [iina-dv-atmos]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install --quiet meson ninja pkg-config nasm ffmpeg libass libplacebo \
            luajit uchardet libarchive libbluray libsoxr rubberband

      - name: Build
        run: |
          git clone --quiet --filter=blob:none \
            https://github.com/avaneev/r8brain-free-src.git ../r8brain
          git -C ../r8brain checkout --quiet \
            8fff6f3db26f14a8f5e8fb871000613673db5753
          export CPLUS_INCLUDE_PATH="$PWD/../r8brain"
          # -Dvulkan=disabled matches how IINA's other/build_dv_atmos_deps.sh configures
          # this tree: that build resolves to HAVE_VULKAN 0 and renders through the GL
          # backend. Leaving vulkan on "auto" here let CI pick it up from brew, so CI was
          # compiling a different render configuration than the one anyone tests against
          # real hardware, and a GL-only regression could pass here and still ship.
          meson setup build --buildtype=release \
            -Dtests=true -Dlibmpv=true -Dcplayer=false \
            -Dorender=enabled -Dsacd=disabled -Dvulkan=disabled
          meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: meson-logs
          path: build/meson-logs/
